<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านกรอบรูป — ระบบคำนวณราคาและใบเสนอราคา</title>
<meta name="theme-color" content="#1f5c4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2320;--mute:#69726c;--line:#e3ded3;--pri:#1f5c4d;--pri-d:#174539;--pri-soft:#e4efea;--acc:#a86f14;--acc-soft:#fbf2dd;--bad:#b3261e;--good:#1b7a4b;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;border:4px solid #e3b65a;border-radius:4px;background:#fff2;box-shadow:inset 0 0 0 2px #0003}
.brand b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.8;font-size:12px}
.top .ghost{background:#fff2;border:1px solid #fff4;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);cursor:pointer;position:relative}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri);font-weight:600}
.nav span{white-space:nowrap}
.nav i{font-style:normal;background:var(--acc);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;position:absolute;top:3px;left:calc(50% + 6px);line-height:1.5}
main{max-width:1120px;margin:0 auto;padding:14px 12px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-top:10px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:14.5px}
.chip.sm{padding:5px 11px;font-size:13.5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid #cfc9bc;border-radius:10px;padding:9px 10px;background:#fff;font-size:16px;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.f{display:block;font-size:13px;color:var(--mute);font-weight:500}
.f>input,.f>select,.f>textarea{margin-top:3px;color:var(--ink);font-weight:400}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .wide{grid-column:1/-1}
.sizerow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.sizerow .xx{padding-bottom:9px;color:var(--mute)}
.sizerow2{display:flex;gap:10px;align-items:end;margin-top:10px}
.seg{display:inline-flex;border:1px solid #cfc9bc;border-radius:10px;overflow:hidden;min-height:42px}
.seg button{border:0;background:#fff;padding:0 16px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.prow{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.prow>label{grid-column:1/-1;font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:-4px}
.prow>select,.prow>input[type=text]{grid-column:1/3;grid-row:2}
.prow>.x{grid-column:3;grid-row:2}
.prow>.nq,.prow>span:not(.pval){grid-column:1;grid-row:3}
.prow>.pval{grid-column:2/4;grid-row:3}
.prow.ex>.nq~.nq{grid-column:2;max-width:110px}
.prow>.sub{grid-row:4}
.prow .nq{padding:9px 6px;text-align:center}
.pval{text-align:right;font-size:13px;color:var(--mute);line-height:1.25;font-variant-numeric:tabular-nums}
.pval b{color:var(--ink);font-size:15px;margin-left:10px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:#f1ede4;color:var(--mute);font-size:18px;cursor:pointer;line-height:1}
.x:hover{background:#f6dcda;color:var(--bad)}
.prow .sub{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.prow .sub input{width:80px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow select{flex:1;min-width:190px;border-style:dashed;color:var(--pri);font-weight:500}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--pri-d)}
.btn.o{background:#fff;color:var(--pri)}
.btn.o:hover{background:var(--pri-soft)}
.btn.sm{padding:8px 12px;min-height:42px;font-weight:500}
.btn.block{width:100%}
.btn.danger{border-color:var(--bad);background:#fff;color:var(--bad)}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:4px 0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}
.mute{color:var(--mute)}
.hint{color:var(--mute);font-size:13.5px;margin:8px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.calc-grid{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
.calc-grid>*,.two>*,.half>*{min-width:0}
main{overflow-x:clip}
.nums .big{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nums .big b{font-size:32px;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.2}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:3px 0;font-variant-numeric:tabular-nums}
.ln.good span:last-child{color:var(--good);font-weight:600}
.ln.bad span:last-child{color:var(--bad);font-weight:600}
.ln.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-size:18px;font-weight:700}
details{margin-top:10px}
summary{cursor:pointer;color:var(--pri);font-size:14px}
table.bd{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
table.bd th,table.bd td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
table.bd th:first-child,table.bd td:first-child{text-align:left}
.banner{background:var(--acc-soft);border:1px solid #ecd9a8;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.pricebar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px #0001;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.pricebar div{line-height:1.2}
.pricebar small{color:var(--mute);font-size:12px;display:block}
.pricebar b{font-size:22px;color:var(--pri);font-variant-numeric:tabular-nums}
.qline{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fdfcf9}
.qhead{display:flex;gap:8px;align-items:center}
.qhead .no{width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.qline .det{margin-top:6px;font-size:14px;min-height:38px}
.qnums{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end;margin-top:8px}
.qnums .lt{text-align:right;font-size:13px;color:var(--mute)}
.qnums .lt b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.qacts{display:flex;gap:16px;margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.top .right{display:flex;align-items:center;gap:8px;flex:none}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:#fff2;border:1px solid #fff4;color:#fff;white-space:nowrap}
.pill.wait{background:#e3b65a;border-color:#e3b65a;color:#3b2a05}
.pill.bad{background:var(--bad);border-color:var(--bad)}
.seg.wide{display:flex;margin-bottom:12px;background:#fff}
.seg.wide button{flex:1;padding:10px 6px;font-size:14.5px}
.seg i,.nav i.red{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.seg i{margin-left:4px}
.seg button.on i{background:#fff;color:var(--bad)}
.tw{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st th{font-size:12.5px;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.st td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.st small,.mv small{display:block;color:var(--mute);font-size:12px;font-weight:400}
table.st .n,.mv .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.st .a{text-align:right;white-space:nowrap}
table.st .a .link{margin-left:12px}
table.st tr.low td{background:#fdf1ef}
.warn{color:var(--bad)!important;font-weight:600}
.st .lbl{display:none}
.brand>div{min-width:0}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:899px){ /* จอมือถือ: แสดงสต๊อกเป็นรายการ 2 บรรทัดต่อวัสดุ */
  table.st thead{display:none}
  table.st tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.st tr.low{background:#fdf1ef;border-radius:8px}
  table.st td{border:0;padding:0;background:none!important}
  table.st td:nth-child(2){grid-column:2;grid-row:1}
  table.st td.re{grid-column:1;grid-row:2;text-align:left;font-size:12.5px;color:var(--mute)}
  table.st td.re small{display:inline;margin-left:6px}
  table.st td.a{grid-column:2;grid-row:2}
  .st .lbl{display:inline}
}
.mv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.bl{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fdfcf9}
.inf{font-size:12.5px;color:var(--mute);margin-top:6px}
.tag{font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--pri-soft);color:var(--pri);font-weight:600;white-space:nowrap}
.tag.st-ordered{background:var(--acc-soft);color:var(--acc)}
.tag.st-done{background:#e3f3ea;color:var(--good)}
.tag.st-cancel{background:#f6dcda;color:var(--bad)}
.sbar{flex-wrap:wrap}
.sbar .sbtn{display:flex;gap:8px;flex-wrap:wrap}
input:disabled{background:#f1ede4;color:var(--mute)}
.docwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#e9e5dc;padding:10px}
.doc{background:#fff;color:#111;padding:28px;min-width:640px;max-width:800px;margin:0 auto;font-size:13px;line-height:1.45}
.doc h1{margin:0;font-size:24px;color:var(--pri);line-height:1.1}
.doc .dh{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--pri);padding-bottom:12px}
.doc .shop{display:flex;gap:12px;align-items:flex-start}
.doc .shop img{max-width:90px;max-height:70px;object-fit:contain}
.doc .shop b{font-size:17px}
.doc .meta{text-align:right;white-space:nowrap}
.doc .meta small{letter-spacing:.14em;color:#777}
.doc .cust{margin:12px 0;padding:10px 12px;background:#f6f4ee;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc table{width:100%;border-collapse:collapse}
.doc th{background:var(--pri);color:#fff;padding:7px 8px;font-weight:600;text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc td{padding:7px 8px;border-bottom:1px solid #ddd;text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.doc th.l,.doc td.l{text-align:left}
.doc th.c,.doc td.c{text-align:center}
.doc td small{color:#555;display:block}
.doc .sum{display:flex;justify-content:space-between;gap:20px;margin-top:10px}
.doc .sum .txt{flex:1;font-size:12.5px}
.doc .sum table{width:300px;flex:none}
.doc .sum td{border:0;padding:3px 8px}
.doc .sum tr.g td{border-top:2px solid #111;font-weight:700;font-size:15px;padding-top:6px}
.doc .baht{background:#f6f4ee;padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .pre{white-space:pre-wrap}
.doc .sign{display:flex;justify-content:space-around;gap:30px;margin-top:46px;text-align:center}
.doc .sign div{flex:1;max-width:220px;border-top:1px dotted #555;padding-top:6px}
.doc.pt h1{font-size:22px}
.doc.pt td,.doc.pt th{text-align:center}
.doc.pt td small{font-size:11px}
.doc .foot{margin-top:10px;color:#555;font-size:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fdfcf9}
.item .row1{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .g{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.item .inf{font-size:12.5px;color:var(--mute);margin-top:6px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:86vh}
dialog::backdrop{background:#0007}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dlg-b{padding:12px 16px 16px}
.sq{border-bottom:1px solid var(--line);padding:10px 0}
.sq b{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1d2320;color:#fff;padding:10px 18px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
#printRoot{display:none}
@media(min-width:900px){
  .nav{position:sticky;top:54px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:0}
  .nav button{flex:none;flex-direction:row;gap:8px;font-size:15px;padding:12px 18px;border-bottom:3px solid transparent}
  .nav button.on{border-bottom-color:var(--pri)}
  .nav i{position:static;margin-left:6px}
  main{padding:20px 16px 60px}
  .calc-grid{grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
  .calc-side{position:sticky;top:122px}
  .prow{grid-template-columns:minmax(0,1fr) 62px 96px 34px}
  .prow>select,.prow>input[type=text],.prow>.x,.prow>.nq,.prow>span:not(.pval),.prow>.pval,.prow.ex>.nq~.nq{grid-column:auto;grid-row:auto;max-width:none}
  .prow>.sub{grid-row:auto}
  .pval{font-size:12px}
  .pval b{display:block;margin-left:0;font-size:14.5px}
  .pricebar{display:none}
  .grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .item .g{grid-template-columns:repeat(4,minmax(0,1fr))}
  #toast{bottom:40px}
  .half{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}
@media(min-width:1040px){
  .two{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
  .two>.card:last-child{position:sticky;top:122px;max-height:calc(100vh - 140px);overflow:auto}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .app,#toast,dialog{display:none!important}
  #printRoot{display:block}
  #printRoot .doc{padding:0;max-width:none;min-width:0;font-size:12.5px}
  .doc tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span><div><b id="hShop">ร้านกรอบรูป</b><small>ระบบคำนวณราคาและใบเสนอราคา</small></div></div>
    <div class="right"><span id="syncPill" class="pill" hidden></span><button class="ghost" id="costBtn" onclick="A.toggleCost()"></button></div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main>
    <section id="tab-calc" class="tab"></section>
    <section id="tab-quote" class="tab" hidden></section>
    <section id="tab-table" class="tab" hidden></section>
    <section id="tab-items" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>
</div>
<div id="printRoot"></div>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const clone=o=>JSON.parse(JSON.stringify(o));
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP=n=>fmt(n,Math.abs(n%1)>0.004?2:0);
const fmtQ=n=>Number((+n||0).toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2});
const pad=(n,l=2)=>String(n).padStart(l,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const toDate=iso=>{const [y,m,d]=String(iso||todayISO()).split('-').map(Number);return new Date(y,m-1,d)};
const thDate=d=>d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- definitions ---------- */
const BASES={
  perim_ft:{label:'ต่อฟุต (ตามเส้นรอบรูป)',u:'ฟุต',kind:'len',f:1/12},
  perim_in:{label:'ต่อนิ้ว (ตามเส้นรอบรูป)',u:'นิ้ว',kind:'len',f:1},
  perim_m:{label:'ต่อเมตร (ตามเส้นรอบรูป)',u:'ม.',kind:'len',f:0.0254},
  united_in:{label:'ต่อนิ้ว (กว้าง + สูง)',u:'นิ้ว',kind:'united',f:1},
  area_sqft:{label:'ต่อตารางฟุต',u:'ตร.ฟ.',kind:'area',f:1/144},
  area_sqin:{label:'ต่อตารางนิ้ว',u:'ตร.นิ้ว',kind:'area',f:1},

function tplRows(type){const t=S.templates[type]||JOBS.find(j=>j.id===type).rows;return t.map(([cat,item,n])=>({id:uid(),cat,item:itemById(item)?item:null,n:n??''}))}
function newJob(type,keep={}){const unit=keep.unit||S.cfg.unit;return {id:uid(),type,w:keep.w??'',h:keep.h??'',unit,matB:keep.matB??(unit==='cm'?5:2),qty:1,rows:tplRows(type),extras:[],override:'',note:''}}
function calcJob(j){
  const k=j.unit==='cm'?1/2.54:1,w=num(j.w)*k,h=num(j.h)*k;
  const sel=j.rows.map(r=>({r,it:itemById(r.item)})).filter(x=>x.it);
  const hasMat=sel.some(x=>x.it.cat==='mat'),hasBar=sel.some(x=>x.it.cat==='bar');
  const b=hasMat?num(j.matB)*k:0,W=w+2*b,H=h+2*b,wrap=num(S.cfg.wrap);
  const parts=sel.map(({r,it})=>{
    const B=BASES[it.basis]||BASES.job;let q=1;
    const inner=['media','coat','bar'].includes(it.cat);
    let pw=inner?w:W,ph=inner?h:H;
    if(it.cat==='media'&&hasBar){pw=w+2*wrap;ph=h+2*wrap}
    if(B.kind==='len'){let L=2*(pw+ph);if(it.cat==='frame')L+=8*num(it.face);q=L*B.f}
    else if(B.kind==='united')q=pw+ph;
    else if(B.kind==='area')q=pw*ph*B.f;
    else if(B.kind==='piece')q=(r.n!==''&&r.n!=null)?num(r.n):(num(it.dq)||1);
    if(B.kind!=='piece'&&B.kind!=='job')q*=1+num(it.waste)/100;
    const cost=q*num(it.cost);let price=q*unitPrice(it);
    if(num(it.min)>0&&q>0&&price<num(it.min))price=num(it.min);
    return {id:r.id,itemId:it.id,name:it.name,q,u:B.u,cost,price};
  });
  j.extras.forEach(e=>parts.push({id:e.id,name:e.name||'รายการเพิ่มเติม',q:1,u:'งาน',cost:num(e.cost),price:num(e.price)}));
  const cost=parts.reduce((a,p)=>a+p.cost,0),raw=parts.reduce((a,p)=>a+p.price,0),auto=roundUp(raw);
  const unit=(j.override!==''&&j.override!=null)?num(j.override):auto,qty=num(j.qty)||1;
  return {parts,cost,raw,auto,unit,qty,total:unit*qty,profit:unit-cost,margin:unit?(unit-cost)/unit*100:0,w,h,W,H,hasMat};
}
function jobTitle(j){
  const t=JOBS.find(x=>x.id===j.type),sel=j.rows.map(r=>itemById(r.item)).filter(Boolean);let n=t.doc;
  if(t.id==='frame'&&sel.some(i=>i.cat==='media'&&/กระจกเงา/.test(i.name)))n='งานกรอบกระจกเงา';
  if(t.id!=='coat'&&sel.some(i=>i.cat==='coat'))n+=(/\)$/.test(n)?' ':'')+'และเคลือบภาพ';
  return n+(num(j.w)&&num(j.h)?` ขนาด ${fmtQ(j.w)} × ${fmtQ(j.h)} ${uLabel(j)}`:'');
}
function jobDetail(j){
  const a=j.rows.map(r=>itemById(r.item)).filter(i=>i&&i.cat!=='hw'&&i.cat!=='labor').map(i=>i.cat==='mat'?`${i.name} (ขอบด้านละ ${fmtQ(j.matB)} ${uLabel(j)})`:i.name);
  j.extras.forEach(e=>e.name&&a.push(e.name));if(j.note)a.push(j.note);return a.join(', ');
}

function genNo(){
  const d=new Date(),base=`${S.cfg.prefix||'QT'}-${pad((d.getFullYear()+543)%100)}${pad(d.getMonth()+1)}`;
  const used=[...S.qlist,...S.quotes].map(x=>String(x.no||'')).filter(n=>n.startsWith(base+'-')).map(n=>(parseInt(n.slice(base.length+1),10)||0)+1);
  return `${base}-${pad(Math.max(cloudOn()?1:num(S.cfg.nextNo)||1,...used),3)}`;
}
function newDraft(){return {id:uid(),no:genNo(),docType:'quote',date:todayISO(),valid:S.cfg.valid,cust:{name:'',phone:'',addr:'',tax:''},lines:[],discType:'amt',disc:'',vatMode:S.cfg.vatMode,deposit:'',note:'',status:'quote',by:'',dirty:false,savedOnce:false}}
const STATUS={quote:'เสนอราคา',ordered:'ยืนยันสั่งทำแล้ว',done:'ส่งมอบแล้ว',cancel:'ยกเลิก'};
const LQ={q:'',st:''};
const isOn=s=>s==='ordered'||s==='done'; // สถานะที่ตัดสต๊อกแล้ว
function quoteMeta(q){const t=quoteTotals(q);return {total:t.total,net:q.vatMode==='incl'?t.after-t.vat:t.after}}
function cleanQuote(q){const c=clone(q);delete c.dirty;return c}
function localMeta(q){const t=quoteTotals(q);return {id:q.id,no:q.no,date:q.date,docType:q.docType,customer:q.cust.name,phone:q.cust.phone,total:t.total,profit:t.profit,status:q.status||'quote',by:q.by||'',updated:q.updated}}

function storeQuote(q){ // เก็บสำเนาในเครื่อง และปรับรายการในประวัติ
  const c=clone(q),i=S.quotes.findIndex(x=>x.id===q.id);if(i>=0)S.quotes[i]=c;else S.quotes.unshift(c);
  if(cloudOn()){if(S.quotes.length>60)S.quotes.length=60;const m=localMeta(q),k=S.qlist.findIndex(x=>x.id===q.id);if(k>=0)S.qlist[k]=m;else S.qlist.unshift(m)}
}
function quoteUses(q){ // ปริมาณวัสดุที่งานในเอกสารนี้ใช้ รวมตามวัสดุ
  const m={};q.lines.forEach(l=>{if(l.kind!=='job'||!l.job)return;calcJob(l.job).parts.forEach(p=>{const it=itemById(p.itemId);if(stockable(it))m[it.id]=(m[it.id]||0)+p.q*num(l.qty)})});
  return Object.entries(m).map(([itemId,qty])=>({itemId,qty:r3(qty)}));
}

async function fetchQuote(id){ // ดึงเอกสารฉบับเต็ม: จากระบบกลางถ้าเชื่อมต่อได้ ไม่เช่นนั้นใช้สำเนาในเครื่อง
  const local=S.quotes.find(q=>q.id===id);
  if(!cloudOn()||S.queue.some(o=>o.data&&(o.data.id===id||(o.data.quote&&o.data.quote.id===id))))return local?clone(local):null;
  try{const r=await api('getQuote',{id});if(r.ok){r.quote.savedOnce=true;r.quote.dirty=false;return r.quote}}catch(e){}
  if(local){toast('เชื่อมต่อไม่ได้ จึงแสดงสำเนาที่เก็บไว้ในอุปกรณ์นี้');return clone(local)}
  toast('ไม่สามารถเปิดเอกสารได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');return null;
}
function quoteTotals(q){
  const sub=q.lines.reduce((a,l)=>a+num(l.unit)*num(l.qty),0),cost=q.lines.reduce((a,l)=>a+num(l.cost)*num(l.qty),0);
  const disc=Math.min(sub,q.discType==='pct'?sub*num(q.disc)/100:num(q.disc)),after=sub-disc,r=num(S.cfg.vatRate);
  let vat=0,total=after;
  if(q.vatMode==='add'){vat=after*r/100;total=after+vat}else if(q.vatMode==='incl'){vat=after*r/(100+r)}
  const dep=num(q.deposit);return {sub,cost,disc,after,vat,total,dep,bal:total-dep,profit:(q.vatMode==='incl'?after-vat:after)-cost};
}

function quoteText(q){
  const t=quoteTotals(q),D=DOCS[q.docType]||DOCS.quote,L=[`${D[0]} ${q.no}`,S.shop.name,`วันที่ ${thDate(toDate(q.date))}`];
  if(q.cust.name)L.push(`ลูกค้า: ${q.cust.name}`);L.push('');
  q.lines.forEach((l,i)=>{L.push(`${i+1}) ${l.title}${l.detail?' — '+l.detail:''}`);L.push(`    ${fmtQ(l.qty)} × ${fmtP(num(l.unit))} = ${fmtP(num(l.unit)*num(l.qty))} บาท`)});
  L.push('');if(t.disc||q.vatMode==='add')L.push(`รวมเป็นเงิน ${fmt(t.sub,2)} บาท`);
  if(t.disc)L.push(`ส่วนลด ${fmt(t.disc,2)} บาท`);if(q.vatMode==='add')L.push(`ภาษีมูลค่าเพิ่ม ${num(S.cfg.vatRate)}% ${fmt(t.vat,2)} บาท`);
  L.push(`จำนวนเงินรวมทั้งสิ้น ${fmt(t.total,2)} บาท${q.vatMode==='incl'?' (รวมภาษีมูลค่าเพิ่มแล้ว)':''}`);
  if(t.dep)L.push(`เงินมัดจำ ${fmt(t.dep,2)} บาท · ยอดคงเหลือ ${fmt(t.bal,2)} บาท`);
  if(q.docType==='quote'&&num(q.valid))L.push(`กำหนดยืนราคา ${num(q.valid)} วัน`);if(q.note)L.push('หมายเหตุ: '+q.note);
  if(S.shop.pay)L.push('',S.shop.pay);if(S.shop.phone)L.push(`โทรศัพท์ ${S.shop.phone}`);return L.join('\n');
}
function bahtText(n){
  n=Math.round(num(n)*100)/100;if(n<=0)return 'ศูนย์บาทถ้วน';
  const T=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{if(s.length>6)return rd(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6));let o='';const L=s.length;
    for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
      if(p===0&&d===1&&o)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่สิบ';else if(p===1&&d===1)o+='สิบ';else o+=T[d]+P[p]}
    return o};
  const [i,f]=n.toFixed(2).split('.');return (+i?rd(String(+i))+'บาท':'')+(+f?rd(String(+f))+'สตางค์':'ถ้วน');
}

function buyCalc(l){

  return {it,conv,amount:qty*net,add:qty*conv,cost:conv>0?net*(1+vat/100)/conv:0};
}
function updBuy(){
  let sum=0;

  const t=$('#buySum');if(!t)return;

/* ---------- การเคลื่อนไหวของสต๊อก (ทำในเครื่องทันที แล้วส่งขึ้นระบบกลาง) ---------- */
function logMove(it,delta,reason,ref){S.moves.unshift({ts:new Date().toISOString(),itemId:it.id,itemName:it.name,delta:r3(delta),unit:bUnit(it),reason,ref:ref||'',by:who(),balance:it.stock});if(S.moves.length>200)S.moves.length=200}
function applyPurchase(p){
  const it=itemById(p.itemId);if(!it)return;
  it.punit=p.punit||'';if(num(p.pqty)>0)it.pqty=num(p.pqty);
  const conv=num(it.pqty)||1,qty=num(p.qty),net=num(p.unitPrice)*(1-num(p.disc)/100),add=r3(qty*conv);
  if(net>0)it.cost=Math.round(net*(1+num(p.vat)/100)/conv*1e4)/1e4; // ต้นทุน = ราคาซื้อล่าสุด หลังหักส่วนลด
  it.stock=r3((num(it.stock)||0)+add);
  S.purchases.unshift({...p,itemName:it.name,total:Math.round(qty*net*100)/100,cost:it.cost,by:who(),ts:new Date().toISOString()});if(S.purchases.length>200)S.purchases.length=200;
  logMove(it,add,'ซื้อเข้า',[p.supplier,p.doc].filter(Boolean).join(' '));
}
function applyUses(uses,sign,ref){(uses||[]).forEach(u=>{const it=itemById(u.itemId),d=r3(sign*num(u.qty));if(!tracked(it)||!d)return;it.stock=r3(num(it.stock)+d);logMove(it,d,d<0?'ตัดตามงาน':'คืนสต๊อก',ref)})}
function usesDiff(a,b){ // ส่วนต่างปริมาณวัสดุ (b − a) ใช้เมื่อแก้ไขงานที่ตัดสต๊อกไปแล้ว
  const m={};(a||[]).forEach(u=>m[u.itemId]=(m[u.itemId]||0)-num(u.qty));(b||[]).forEach(u=>m[u.itemId]=(m[u.itemId]||0)+num(u.qty));
  return Object.entries(m).filter(([,q])=>Math.abs(q)>0.0005).map(([itemId,qty])=>({itemId,qty:r3(qty)}));
}

async function connect(url,pin){
  url=scriptUrl(url);pin=String(pin||'').trim();
  if(!url||!pin){toast('กรุณากรอกที่อยู่ระบบและรหัสร้านให้ครบ');return false}
  let r;try{r=await api('login',null,null,{url,pin})}catch(e){toast('เชื่อมต่อไม่สำเร็จ กรุณาตรวจสอบที่อยู่ระบบและอินเทอร์เน็ต');return false}
  if(!r.ok){toast(r.error==='PIN'?'รหัสร้านไม่ถูกต้อง':'เชื่อมต่อไม่สำเร็จ: '+r.error);return false}
  const same=S.cloud&&S.cloud.url===url;
  S.cloud={url,pin,role:r.role,err:'',last:0};
  if(!same){S.queue=[];S.dirtyItems={};S.dirtySet=false}
  if(r.state.empty&&r.role==='owner'){ // ชีตยังว่าง: ส่งข้อมูลในอุปกรณ์นี้ขึ้นไปเป็นข้อมูลตั้งต้น
    push('init',{items:S.items,settings:{shop:S.shop,cfg:S.cfg,templates:S.templates,sizes:S.sizes},quotes:S.quotes.map(q=>({quote:cleanQuote(q),meta:quoteMeta(q)}))});
    toast('เชื่อมต่อแล้ว กำลังส่งข้อมูลในอุปกรณ์นี้ขึ้นระบบกลาง');
  }else{
    if(S.queue.length)flush();else applyState(r.state);
    toast(r.state.empty?'เชื่อมต่อแล้ว แต่ระบบกลางยังไม่มีข้อมูล กรุณาให้เจ้าของร้านเชื่อมต่อก่อน':'เชื่อมต่อเรียบร้อยแล้ว');
  }
  save();render();return true;
}
let dirtyT=null,retryT=null,flushing=false;
function markItem(id){if(!cloudOn())return;S.dirtyItems[id]=1;clearTimeout(dirtyT);dirtyT=setTimeout(()=>{flushDirty();save();flush()},1500);syncUI()}
function markSettings(){if(!cloudOn()||isStaff())return;S.dirtySet=true;clearTimeout(dirtyT);dirtyT=setTimeout(()=>{flushDirty();save();flush()},1500);syncUI()}
function flushDirty(){ // รวมการแก้ไขวัสดุ/ตั้งค่าที่ค้างอยู่เข้าคิวส่ง
  clearTimeout(dirtyT);
  const ids=Object.keys(S.dirtyItems);
  if(ids.length){S.queue.push({opId:uid()+uid(),action:'saveItems',data:{items:ids.map(itemById).filter(Boolean).map(clone)}});S.dirtyItems={}}
  if(S.dirtySet){S.queue.push({opId:uid()+uid(),action:'saveSettings',data:{settings:{shop:S.shop,cfg:S.cfg,templates:S.templates,sizes:S.sizes}}});S.dirtySet=false}
}
function push(action,data){if(!cloudOn())return;flushDirty();S.queue.push({opId:uid()+uid(),action,data});save();flush()}
async function flush(){ // ส่งคิวทีละรายการตามลำดับ ถ้าเน็ตหลุดจะเก็บไว้ส่งใหม่
  if(flushing||!cloudOn())return;flushing=true;syncUI();let repull=false;
  try{
    while(cloudOn()&&S.queue.length){
      const op=S.queue[0],res=await api(op.action,op.data,{opId:op.opId,wantState:S.queue.length===1});
      if(!cloudOn())break;
      if(!res.ok&&res.error==='PIN'){S.cloud.err='pin';break}
      S.queue.shift();S.cloud.err='';
      if(!res.ok){toast('ระบบกลางไม่รับรายการนี้: '+res.error);repull=true}
      else{if(op.action==='saveQuote'&&res.no)fixNo(res.id,res.no);if(res.state&&!S.queue.length&&!repull)applyState(res.state)}
      save();
    }
  }catch(e){if(cloudOn()){S.cloud.err='net';clearTimeout(retryT);retryT=setTimeout(()=>flush(),20000)}}
  flushing=false;save();syncUI();
  if(!cloudOn())return;
  if(S.cloud.err==='pin')connectDialog('รหัสร้านไม่ถูกต้องหรือถูกเปลี่ยน กรุณาใส่รหัสใหม่');
  else if(repull&&!S.cloud.err)pull();
}
async function pull(){ // ดึงข้อมูลล่าสุดจากระบบกลาง (ถ้ามีรายการค้างส่ง จะส่งก่อน)
  if(!cloudOn()||flushing)return;
  if(S.queue.length||Object.keys(S.dirtyItems).length||S.dirtySet){flushDirty();save();return flush()}
  try{
    const r=await api('pull');if(!cloudOn())return;
    if(r.ok){S.cloud.err='';S.cloud.role=r.role;applyState(r.state)}
    else if(r.error==='PIN'){S.cloud.err='pin';connectDialog('รหัสร้านไม่ถูกต้องหรือถูกเปลี่ยน กรุณาใส่รหัสใหม่')}
  }catch(e){if(cloudOn())S.cloud.err='net'}
  save();syncUI();
}
function applyState(st){ // แทนที่ข้อมูลในเครื่องด้วยข้อมูลจากระบบกลาง
  if(!st||S.queue.length||Object.keys(S.dirtyItems).length||S.dirtySet)return; // ยังมีรายการที่ไม่ได้ส่ง รอรอบถัดไป
  S.cloud.last=Date.now();
  if(st.empty){save();syncUI();return}
  S.items=st.items.map(i=>({...I(i.id,i.cat,i.name,i.basis,i.cost,i.price),...i}));
  const g=st.settings||{};
  if(g.shop)S.shop={...S.shop,...g.shop};if(g.cfg)S.cfg={...S.cfg,...g.cfg};if(g.templates)S.templates=g.templates;if(Array.isArray(g.sizes))S.sizes=g.sizes;
  S.qlist=st.qlist||[];S.purchases=st.buys||[];S.moves=st.moves||[];
  const has=id=>!id||S.items.some(i=>i.id===id);
  [S.calc,S.table.job].forEach(j=>j.rows.forEach(r=>{if(!has(r.item))r.item=null}));S.table.colItems=S.table.colItems.filter(has);
  const q=S.draft,m=S.qlist.find(x=>x.id===q.id);
  if(m&&!q.dirty){q.status=m.status;q.no=m.no}
  if(!q.savedOnce&&!q.lines.length)q.no=genNo();
  save();renderIfIdle();
}
function fixNo(id,no){ // ระบบกลางออกเลขที่ใหม่ให้เมื่อเลขซ้ำกับอีกเครื่อง
  let changed=false;[S.draft,...S.quotes].forEach(q=>{if(q&&q.id===id&&q.no!==no){q.no=no;changed=true}});
  const m=S.qlist.find(x=>x.id===id);if(m)m.no=no;
  if(changed)toast('เลขที่เอกสารซ้ำกับอีกเครื่อง ระบบเปลี่ยนเป็น '+no);
}
function renderIfIdle(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('main'))syncUI();else render()}
function syncUI(){
  const e=$('#syncPill');if(!e)return;
  if(!cloudOn()){e.hidden=true;return}
  const n=S.queue.length+(Object.keys(S.dirtyItems).length?1:0)+(S.dirtySet?1:0),err=S.cloud.err;
  e.hidden=false;e.className='pill '+(err?'bad':n?'wait':'ok');e.title='ข้อมูลกลางของร้าน';
  e.textContent=err==='net'?`ออฟไลน์${n?` · รอส่ง ${n}`:''}`:err==='pin'?'รหัสไม่ถูกต้อง':n?'กำลังบันทึก…':'บันทึกแล้ว';
}

    d.innerHTML=`<div class="dlg-h"><b>ประวัติเอกสาร</b><button class="x" aria-label="ปิด" onclick="document.getElementById('dlg').close()">×</button></div><div class="dlg-b">
    <input type="text" aria-label="ค้นหา" placeholder="ค้นหาเลขที่ ชื่อลูกค้า หรือหมายเลขโทรศัพท์" value="${esc(LQ.q)}" oninput="A.listFilter('q',this.value)">
    <div class="chips" style="margin:10px 0">${[['','ทั้งหมด'],...Object.entries(STATUS)].map(([k,v])=>`<button class="chip sm${LQ.st===k?' on':''}" data-st="${k}" onclick="A.listFilter('st','${k}')">${v}</button>`).join('')}</div>
    <div id="lqRows"></div></div>`;
    listRows();if(!d.open)d.showModal()},
  listFilter(f,v){LQ[f]=v;if(f==='st')$$('#dlg [data-st]').forEach(b=>b.classList.toggle('on',b.dataset.st===v));listRows()},
  async openQuote(id,force){const cur=S.draft;if(force!==true&&cur.dirty&&cur.lines.length&&cur.id!==id)return ask('เอกสารปัจจุบันยังไม่ได้บันทึก ต้องการเปิดเอกสารอื่นโดยไม่บันทึกหรือไม่','เปิดเอกสาร',()=>A.openQuote(id,true));
    const q=await fetchQuote(id);if(!q)return;
    S.draft=q;S.editing=null;save();$('#dlg').close();S.tab='quote';render()},
  async dupQuote(id){const n=await fetchQuote(id);if(!n)return;
    n.id=uid();n.no=genNo();n.date=todayISO();n.savedOnce=false;n.dirty=true;n.status='quote';n.uses=null;n.by='';
    n.lines.forEach(l=>{l.id=uid();if(l.kind==='job'&&l.job&&l.cost==null)l.cost=Math.round(calcJob(l.job).cost*100)/100});
    S.draft=n;S.editing=null;save();$('#dlg').close();S.tab='quote';render();toast('ทำสำเนาเป็นเอกสารใหม่แล้ว')},
  delQuote(id){const m=quoteList().find(x=>x.id===id);if(!m)return;
    ask(`ต้องการลบเอกสารเลขที่ ${m.no} อย่างถาวรหรือไม่\nเมื่อลบแล้วจะไม่สามารถกู้คืนได้`,'ลบ',()=>{
      const loc=S.quotes.find(x=>x.id===id);if(loc&&isOn(loc.status))applyUses(loc.uses||[],1,loc.no);
      S.quotes=S.quotes.filter(x=>x.id!==id);S.qlist=S.qlist.filter(x=>x.id!==id);if(S.draft.id===id)S.draft=newDraft();
      push('deleteQuote',{id});save();A.showList();render()},1)},
  printQuote(){const q=S.draft;printHTML(docHTML(q),`${(DOCS[q.docType]||DOCS.quote)[0]} ${q.no}${q.cust.name?' - '+q.cust.name:''}`)},
  copyQuote(){copyText(quoteText(S.draft))},
  tblSet(f,v,soft){S.table[f]=v;if(f==='colCat')S.table.colItems=[];save();if(soft&&f==='title')$('#tDoc').innerHTML=tableHTML();else renderTable()},
  tblCol(id){const a=S.table.colItems,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);save();renderTable()},
  tblSize(k){const a=S.table.off,i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);save();renderTable()},
  printTable(){printHTML(tableHTML(),S.table.title||'ตารางราคา')},
  csvTable(){const cell=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};download((S.table.title||'ตารางราคา')+'.csv','﻿'+tableMatrix().map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')},
  copyTable(){copyText(tableMatrix().map(r=>r.join('\t')).join('\n'))},
  itemCat(c){S.itemCat=c;save();renderItems()},
  itemSet(id,f,v,re){const it=itemById(id);it[f]=v;markItem(id);save();if(re)renderItems();else itemInfo(it)},
  itemAdd(){const c=CAT[S.itemCat],n=I('u_'+uid(),c.id,'',c.basis,'','',c.id==='frame'?{face:1}:{});S.items.push(n);markItem(n.id);save();renderItems();const all=$$('#tab-items .item .row1 input');all.length&&all[all.length-1].focus()},
  itemDel(id){const it=itemById(id);ask(`ต้องการลบ “${it.name||'รายการนี้'}” ออกจากรายการวัสดุหรือไม่`,'ลบ',()=>{S.items=S.items.filter(i=>i.id!==id);
    [S.calc,S.table.job].forEach(j=>j.rows.forEach(r=>{if(r.item===id)r.item=null}));S.table.colItems=S.table.colItems.filter(x=>x!==id);delete S.dirtyItems[id];push('deleteItem',{id});save();renderItems()},1)},
  bulk(){const d=$('#dlg');d.innerHTML=`<div class="dlg-h"><b>ปรับราคาขายทั้งหมวด</b><button class="x" aria-label="ปิด" onclick="document.getElementById('dlg').close()">×</button></div><div class="dlg-b">
    <p style="margin-top:0">ปรับราคาขายของ “${CAT[S.itemCat].name}” ทุกรายการพร้อมกัน</p>
    <label class="f">อัตราการปรับ (%) เช่น 10 = เพิ่มขึ้น 10%, -5 = ลดลง 5%<input id="bulkPct" type="number" step="any" value="10"></label>
    <div class="toolbar" style="margin:14px 0 0"><button class="btn" onclick="A.bulkGo()">ปรับราคา</button><button class="btn o" onclick="document.getElementById('dlg').close()">ยกเลิก</button></div></div>`;d.showModal()},
  bulkGo(){const k=num($('#bulkPct').value);$('#dlg').close();if(!k)return;
    S.items.filter(i=>i.cat===S.itemCat).forEach(i=>{i.price=Math.round(unitPrice(i)*(1+k/100)*100)/100;markItem(i.id)});save();renderItems();toast(`ปรับราคา ${k>0?'+':''}${k}% เรียบร้อยแล้ว`)},
  shopSet(f,v,re){S.shop[f]=v;markSettings();save();if(f==='name')$('#hShop').textContent=v||'ร้านกรอบรูป';if(re)renderSettings()},
  cfgSet(f,v){S.cfg[f]=v;markSettings();save()},
  sizesSet(t){S.sizes=t.split('\n').map(s=>s.trim()).filter(s=>parseSize(s));markSettings();save()},
  logo(file){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,360/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.shop.logo=c.toDataURL('image/png');markSettings();save();renderSettings();toast('เพิ่มโลโก้เรียบร้อยแล้ว')};img.src=r.result};r.readAsDataURL(file)},
  exportData(){const d=clone(S);d.cloud=null;d.queue=[];d.qlist=[];d.dirtyItems={};d.dirtySet=false;download(`สำรองข้อมูลร้านกรอบรูป-${todayISO()}.json`,JSON.stringify(d),'application/json')},
  importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.items))throw 0;
    ask('ต้องการนำเข้าข้อมูลจากไฟล์นี้ และแทนที่ข้อมูลทั้งหมดในอุปกรณ์นี้หรือไม่','นำเข้า',()=>{localStorage.setItem(KEY,JSON.stringify(d));load();render();
if(cloudOn())pull();else if(hashShop())connectDialog();
window.addEventListener('focus',()=>{if(cloudOn()&&Date.now()-(S.cloud.last||0)>30000)pull()});
window.addEventListener('online',()=>{if(cloudOn())pull()});toast('นำเข้าข้อมูลเรียบร้อยแล้ว')})}catch(e){toast('ไฟล์ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง')}};r.readAsText(file)},
  resetAll(){ask(cloudOn()?'ต้องการล้างข้อมูลในอุปกรณ์นี้และยกเลิกการเชื่อมต่อหรือไม่\nข้อมูลใน Google Sheets ของร้านจะไม่ถูกลบ':'ต้องการล้างข้อมูลทั้งหมด (วัสดุ ราคา เอกสาร และการตั้งค่า) กลับเป็นค่าเริ่มต้นหรือไม่\nเมื่อล้างแล้วจะไม่สามารถกู้คืนได้','ล้างข้อมูล',()=>{localStorage.removeItem(KEY);load();save();render();toast('ล้างข้อมูลเรียบร้อยแล้ว')},1)}
};

/* ---------- render ---------- */
function render(){
  $('#hShop').textContent=S.shop.name||'ร้านกรอบรูป';
  const cb=$('#costBtn');cb.hidden=isStaff();cb.textContent=S.hideCost?'แสดงต้นทุน':'ซ่อนต้นทุน';
  syncUI();
  const low=S.items.filter(isLow).length,badge=t=>t.id==='quote'&&S.draft.lines.length?`<i>${S.draft.lines.length}</i>`:t.id==='items'&&low?`<i class="red">${low}</i>`:'';
  $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t.id?'on':''}" onclick="A.tab('${t.id}')"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg><span>${t.name}${badge(t)}</span></button>`).join('');
  $$('.tab').forEach(e=>e.hidden=e.id!=='tab-'+S.tab);
  ({calc:renderCalc,quote:renderQuote,table:renderTable,items:renderItems,settings:renderSettings})[S.tab]();
}
load();render();
if(cloudOn())pull();else if(hashShop())connectDialog();
window.addEventListener('focus',()=>{if(cloudOn()&&Date.now()-(S.cloud.last||0)>30000)pull()});
window.addEventListener('online',()=>{if(cloudOn())pull()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
